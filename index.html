<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#17222c">
  <title>スライム押し付け合戦 v0.01</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="gameWrap">
    <canvas id="game" width="1000" height="600" aria-label="スライム押し付け合戦"></canvas>
    <section id="start" class="panel">
      <h1>スライム押し付け合戦</h1>
      <p>ちょっと臭いスライムを、隣村へ。</p>
      <button id="startBtn">試合開始</button>
      <small>v0.01 / 3対3 CPU戦</small>
    </section>
    <section id="result" class="panel hidden">
      <h2 id="resultTitle">試合終了</h2>
      <p id="resultText"></p>
      <button id="retryBtn">もう一度</button>
    </section>
    <div id="controls" class="hidden" aria-label="タッチ操作">
      <div id="stick"><div id="knob"></div></div>
      <div class="buttons">
        <button data-action="jump" class="jump">ジャンプ</button>
        <button data-action="skill" class="skill">スキル</button>
        <button data-action="dash" class="dash">ダッシュ</button>
        <button data-action="kick" class="kick">キック</button>
      </div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
